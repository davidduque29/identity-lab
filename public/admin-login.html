<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Administración · Identity Lab</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="portal.css" />
    <script src="deployment-config.js"></script>
    <script defer src="admin-login.js"></script>
    <meta name="theme-color" content="#245f4d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="pwa.css" />
    <script defer src="pwa.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="panel profile-form">
        <h1>Acceso administrativo</h1>
        <p id="loginInstruction">
          Entra con el correo y la contraseña de tu cuenta de Identity Lab.
        </p>
        <form id="login">
          <label
            >Correo administrativo<input
              id="email"
              type="email"
              required
              autocomplete="username"
          /></label>
          <label
            >Contraseña
            <div class="password-field">
              <input
                id="password"
                type="password"
                required
                autocomplete="current-password"
              /><button
                id="togglePassword"
                class="secondary"
                type="button"
                aria-label="Mostrar contraseña"
                aria-pressed="false"
              >
                Mostrar
              </button>
            </div></label
          >
          <label id="confirmLabel" hidden
            >Confirma tu contraseña<input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
          /></label>
          <p id="passwordHint" hidden>
            Usa al menos 15 caracteres. Puedes usar una frase con espacios. No reutilices
            una contraseña de otro servicio.
          </p>
          <button class="primary" id="submit" type="submit">Entrar</button>
        </form>
        <button id="recover" class="secondary" type="button">
          Olvidé mi contraseña / Configurar contraseña
        </button>
        <button id="cancelRecovery" class="secondary" type="button" hidden>
          Volver al inicio de sesión
        </button>
        <p id="status" role="status" aria-live="polite"></p>
        <a href="portal.html">Volver al laboratorio</a>
      </section>
    </main>
  </body>
</html>
