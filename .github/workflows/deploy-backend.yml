name: Deploy Identity Lab backend
on:
  push:
    branches: [main]
    paths: ['server/**', 'supabase/functions/**', 'scripts/build-pages.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identity-lab-backend
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.SUPABASE_AUTODEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/build-pages.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.83.0
      - name: Deploy authenticated Edge API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN as an Actions secret. The existing backend is not modified."
            exit 1
          fi
          supabase functions deploy identity-api --project-ref hckqcyhsnuwblwjvqpdi --no-verify-jwt --use-api --import-map supabase/functions/identity-api/deno.json
